<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мастер AI</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
}

header {
  padding: 20px;
  text-align: center;
  background: #17243a;
  font-size: 23px;
  font-weight: bold;
}

.status {
  text-align: center;
  color: #50d6a0;
  padding: 12px;
}

#chat {
  height: 65vh;
  overflow-y: auto;
  padding: 15px;
}

.message {
  padding: 13px;
  margin: 10px 0;
  border-radius: 12px;
  background: #243650;
  overflow-wrap: anywhere;
}

.user {
  background: #285c85;
}

.controls {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 12px;
  background: #17243a;
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border-radius: 10px;
  border: none;
}

button {
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #2688e8;
  color: white;
  font-size: 16px;
}
</style>
</head>
<body>

<header>🤖 МАСТЕР AI</header>

<div class="status">● Твой персональный помощник</div>

<div id="chat">
  <div class="message">
    Привет! Я Мастер AI.<br>
    Я готов помогать тебе создавать Android-приложения.
    <br><br>
    Можешь написать мне или воспользоваться микрофоном.
  </div>
</div>

<div class="controls">
  <input id="input" placeholder="Напиши своё задание...">
  <button onclick="send()">➤</button>
  <button onclick="speak()">🎤</button>
</div>

<script>
function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  addMessage(
    "Задание принято! Подключение искусственного интеллекта будет добавлено на следующем этапе.",
    ""
  );
}

function addMessage(text, type) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");

  div.className = "message " + type;
  div.textContent = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function speak() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Голосовой ввод не поддерживается этим браузером.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "ru-RU";
  recognition.start();

  recognition.onresult = function(event) {
    document.getElementById("input").value =
      event.results[0][0].transcript;
  };
}
</script>

</body>
</html>
