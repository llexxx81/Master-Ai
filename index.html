<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мастер AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}
header{background:#17243a;text-align:center;padding:20px;font-size:25px;font-weight:bold}
.status{text-align:center;color:#50d6a0;padding:15px}
#chat{height:calc(100vh - 190px);overflow-y:auto;padding:15px}
.msg{padding:14px;margin:10px 0;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{background:#245078;margin-left:12%}
.bot{background:#263a55;margin-right:5%}
.system{color:#ffcf70;text-align:center;padding:10px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#17243a;padding:12px;display:flex;gap:8px}
textarea{flex:1;resize:none;border:0;border-radius:13px;padding:14px;font-size:16px;min-height:55px;max-height:120px}
button{border:0;border-radius:13px;background:#2789e8;color:white;font-size:22px;padding:10px 15px}
button:disabled{opacity:.5}
</style>
</head>
<body>

<header>🤖 МАСТЕР AI</header>
<div class="status">● Твой персональный помощник</div>

<div id="chat">
<div class="msg bot">Привет! Я Мастер AI.<br>
Я помогу тебе создавать Android-приложения, писать и исправлять код.<br><br>
Напиши, что нужно сделать, или воспользуйся микрофоном.</div>
</div>

<div class="bottom">
<textarea id="input" placeholder="Напиши своё задание..."></textarea>
<button id="send" onclick="sendMessage()">➤</button>
<button onclick="startVoice()">🎤</button>
</div>

<script>
const API_URL = "https://master-ai-api.sarprof164.workers.dev/";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendButton = document.getElementById("send");

let history = [];

try {
  history = JSON.parse(localStorage.getItem("masterAI_history") || "[]");
  history.forEach(item => addMessage(item.text, item.role));
} catch(e) {
  history = [];
}

function addMessage(text, role) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function saveHistory() {
  try {
    localStorage.setItem("masterAI_history", JSON.stringify(history.slice(-30)));
  } catch(e) {}
}

async function sendMessage() {
  const message = input.value.trim();
  if (!message || sendButton.disabled) return;

  input.value = "";
  addMessage(message, "user");

  history.push({role:"user", text:message});
  saveHistory();

  sendButton.disabled = true;
  addMessage("Мастер AI думает...", "system");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        prompt: message,
        history: history.slice(-12)
      })
    });

    const data = await response.json();

    chat.lastChild.remove();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка сервера: " + response.status);
    }

    const answer =
      data.reply ||
      data.response ||
      data.answer ||
      data.content ||
      data.message;

    if (!answer) {
      throw new Error("Сервер ответил, но текст ответа не найден.");
    }

    addMessage(answer, "bot");

    history.push({role:"assistant", text:answer});
    saveHistory();

    speak(answer);

  } catch(error) {
    if (chat.lastChild && chat.lastChild.className === "system") {
      chat.lastChild.remove();
    }

    addMessage("Не удалось получить ответ: " + error.message, "system");
  }

  sendButton.disabled = false;
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Голосовой ввод не поддерживается этим браузером. Используй микрофон клавиатуры.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "ru-RU";
  recognition.interimResults = false;

  recognition.onresult = function(event) {
    input.value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = function() {
    alert("Не удалось распознать речь. Попробуй ещё раз.");
  };

  recognition.start();
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "ru-RU";
  utterance.rate = 1;

  speechSynthesis.speak(utterance);
}
</script>

</body>
</html>
